Extracto real (recortado a mano a lo mínimo necesario) de
https://www.sensacine.com/cines/cine/E0402/ (Cinesa Proyecciones, Madrid),
descargado en vivo durante la sesión de la tarea 023. Conserva la
estructura real de clases CSS/atributos `data-*` que usa el parser
(`fetch_cinema_showtimes`), con solo 2 de las 8 películas reales de la
cartelera capturada:

  - "El último mono": caso simple, una única versión con 2 horarios.
  - "Spider-Man: Brand New Day": incluye la versión "En V.O.S.E." tal como
    aparece DOS VECES en el HTML real de origen (mismo `data-showtime-id`
    en ambas), un defecto de la propia fuente documentado en el módulo —
    este fixture reproduce esa duplicación real para probar la
    deduplicación por `data-showtime-id`.

Todos los títulos, URLs, fechas/horas ISO y `data-showtime-id` son reales,
tal como los devolvió sensacine.com en el momento de la captura.
-->
